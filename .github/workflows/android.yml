name: Android CI

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
    paths-ignore:
      - "README.md"
      - ".github/**"
      - "docs/**"
      - "*.md"
  pull_request:
    branches: [ "main", "master" ]
    paths-ignore:
      - "README.md"
      - ".github/**"
      - "docs/**"
      - "*.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build & Test APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false

      - name: Generate Gradle Wrapper
        run: gradle wrapper

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate Debug Keystore
        run: keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Run Unit & Robolectric Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: xnode-debug-apks
          path: app/build/outputs/apk/debug/*.apk

      - name: Prepare Release APKs
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
        run: |
          cp app/build/outputs/apk/debug/app-universal-debug.apk app/build/outputs/apk/debug/xnode-debug.apk || cp app/build/outputs/apk/debug/app-arm64-v8a-debug.apk app/build/outputs/apk/debug/xnode-debug.apk || true
          cp app/build/outputs/apk/debug/app-arm64-v8a-debug.apk app/build/outputs/apk/debug/xnode-arm64-v8a-debug.apk || true
          cp app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk app/build/outputs/apk/debug/xnode-armeabi-v7a-debug.apk || true
          cp app/build/outputs/apk/debug/app-x86_64-debug.apk app/build/outputs/apk/debug/xnode-x86_64-debug.apk || true

      - name: Publish APK to Releases
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: "Latest Debug Build"
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.0-build-{0}', github.run_number) }}
          prerelease: true
          files: |
            app/build/outputs/apk/debug/xnode-debug.apk
            app/build/outputs/apk/debug/xnode-arm64-v8a-debug.apk
            app/build/outputs/apk/debug/xnode-armeabi-v7a-debug.apk
            app/build/outputs/apk/debug/xnode-x86_64-debug.apk
